<!doctype html>
<!-- The same HUD at 81d2a72, the fix a person asked for after looking at a screenshot: two short rows that claim no width of their own. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--ink:#120b14;--cream:#f1e6cf;--rust:#ec803a;--panel:rgba(12,8,16,.86);--line:rgba(241,230,207,.22);
  --f-display:'Bungee','Impact','Arial Black',sans-serif;--f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace}
html,body{height:100%}
body{margin:0;background:#3a2548;color:var(--cream);overflow:hidden;font-family:var(--f-mono)}
.hud{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:12px 16px 0}
.vitals{display:flex;flex-direction:column;gap:6px;min-width:0}
.hearts{font-size:22px;line-height:1;letter-spacing:3px;color:#e3285c;text-shadow:0 2px 0 var(--ink)}
#mini{display:block;width:116px;height:116px;border-radius:50%;border:2px solid var(--cream);background:#0d0812;box-shadow:0 2px 0 var(--ink),0 0 0 2px var(--ink);box-sizing:content-box}
.beans{font-family:var(--f-display);font-size:18px;color:var(--rust);text-shadow:0 2px 0 var(--ink);white-space:nowrap}
.beans.cover{font-size:14px;width:0}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;min-width:0}
.obj{font-size:11px;letter-spacing:.08em;text-transform:uppercase;background:var(--panel);border:1px solid var(--line);padding:6px 10px;max-width:min(58vw,360px);text-align:right;line-height:1.4}
.objpoint{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.08em;background:var(--panel);border:1px solid var(--line);padding:4px 10px}
.rep{font-size:10px;letter-spacing:.08em;text-transform:uppercase;background:var(--panel);border:1px solid var(--line);padding:4px 9px;max-width:min(58vw,360px)}
</style>
<div class="hud">
  <div class="vitals">
    <div id="mini"></div>
    <div class="hearts">♥♥♥</div>
    <div class="beans" id="beans">Beans 0/12</div>
    <div class="beans cover" id="cover">Hood up · Act blown<br>Suspicion ▮▮▮▮▮▮▮▮▮▮ 100%</div>
  </div>
  <div class="right">
    <div class="obj" id="obj">Stock up on beans (1/12)</div>
    <div class="objpoint">270 m</div>
    <div class="rep">People 3</div>
  </div>
</div>
