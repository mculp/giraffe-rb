# Sandi Metz's limits, and only those, from the sandi gem: `bundle exec sandi` counts these offenses against
# .sandi-baseline.json and lets the counts fall but never rise. A directory of code that is not under Include is not
# measured.
inherit_gem:
  sandi: config/sandi.yml

AllCops:
  TargetRubyVersion: 3.4
  Include:
    - bin/giraffe
    - lib/**/*.rb
    - scripts/*.rb
