name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: "3.4"
          # Install runtime dependencies and development tools from the lockfile.
          bundler-cache: true
      - run: gem install sqlite3 -v 2.10.2 --no-document
      - run: bin/test
      - run: bundle exec sandi
