name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: "3.4"
      - run: gem install sqlite3 -v 2.10.2 --no-document
      - run: gem install json_schemer -v 2.5.0 --no-document
      - run: bin/test
      # Pinned because the baseline's counts are this version's. bin/test does not need RuboCop, so only bin/sandi's step installs it.
      - run: gem install rubocop -v 1.87.0 --no-document
      - run: bin/sandi
